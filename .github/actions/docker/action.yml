---
name: Docker image
description: Build Docker image
inputs:
  docker_img_name:
    description: The docker image name.
    required: false
    default: ''
  docker_img_tag:
    description: The docker image tag. Defaults to the current git state.
    required: false
    default: ''
  docker_provider:
    description: The docker image provider. Only 'github' (GitHub Container Registry) is supported.
    required: false
    default: 'github'

outputs:
  image-name:
    description: Docker image name
    value: ${{ steps.build-docker-image.outputs.image-name }}
  image-ref:
    description: Docker image reference
    value: ${{ steps.build-docker-image.outputs.image-ref }}
  image-tag:
    description: Docker image tag
    value: ${{ steps.build-docker-image.outputs.image-tag }}
  image-digest:
    description: Docker image SHA-256 digest
    value: ${{ steps.docker-push.outputs.image-digest }}

runs:
  using: composite
  steps:
    - name: Build docker image
      shell: bash
      id: build-docker-image
      run: |
        echo "Build docker image with Makefile [${{ inputs.makefile_path }}] and target(s) [${{ inputs.docker_build_make_targets }}]"
        echo "::group::Building Docker image"
        cd "${makefile_dirname}"
        make -f ${makefile_fname} ${{ inputs.docker_build_make_targets }}
        echo "::endgroup::"
        echo "::group::Writing Step summary"
        image_full_ref="$(make -f ${makefile_fname} print-DOCKER_FULL_IMAGE_REF)"
        image_name="$(make -f ${makefile_fname} print-DOCKER_IMAGE_REF_NO_TAG)"
        image_tag="$(echo ${image_full_ref} | awk -F: '{print $2}')"
        echo "image-full-ref=${image_full_ref}" >> "${GITHUB_OUTPUT}"
        echo "image-name=${image_name}" >> "${GITHUB_OUTPUT}"
        echo "image-tag=${image_tag}" >> "${GITHUB_OUTPUT}"
        (
          echo "## Docker Build :whale2:"
          echo ""
          echo "| Metadata       | Value |"
          echo "|----------------|-------|"
          echo "| Image          | ${image_name} |"
          echo "| Tag            | ${image_tag} |"
          echo "| Image and tag  | ${image_full_ref} |"
        ) >> "${GITHUB_STEP_SUMMARY}"
        echo "::endgroup::"

    - name: Scan Docker image with Wiz
      uses: dktunited/security/wiz@main
      if: ${{ env.DISABLE_CWPP_SCAN != 'true' }}
      with:
        docker-image: ${{ env.DOCKER_FULL_IMAGE_REF }}
        wiz-debug: ${{ inputs.wiz_debug == 'false' && '0' || '1' }}
        wiz-client-id: ${{ inputs.wiz_client_id }}
        wiz-client-secret: ${{ inputs.wiz_client_secret }}

    - name: Push Docker image to GAR
      if: github.event_name == 'push' || inputs.force_docker_push != 'false'
      id: docker-push
      shell: bash
      run: |
        echo "::group::Pushing Docker image to GAR"
        docker push ${{ steps.build-docker-image.outputs.image-full-ref }}
        image_digest="$(docker inspect --format '{{index .RepoDigests 0}}' ${{ steps.build-docker-image.outputs.image-full-ref }} | awk -F@ '{print $2}')"
        echo "image-digest=${image_digest}" >> "${GITHUB_OUTPUT}"
        echo "::endgroup::"
        echo "::group::Writing Step Summary"
        gcp_project_id=$(make -f ${makefile_fname} print-GCP_PROJECT_ID)
        gcp_region=$(make -f ${makefile_fname} print-GCP_REGION)
        gcp_gar_repo_name=$(make -f ${makefile_fname} print-GCP_GAR_REPO_NAME)
        (
          echo "## Docker Push :whale2:"
          echo ""
          echo "| Information    | Value |"
          echo "|----------------|-------|"
          echo "| Registry       | ${gcp_gar_repo_name} |"
          echo "| Project        | ${gcp_project_id}    |"
          echo "| Region         | ${gcp_region}        |"
          echo "| url            | [${gcp_project_id}/${gcp_region}/${gcp_gar_repo_name}](https://console.cloud.google.com/artifacts/docker/${gcp_project_id}/${gcp_region}/${gcp_gar_repo_name}?project=${gcp_project_id}) |"
          echo "| SHA-256 digest | ${image_digest}      |"
        ) >> "${GITHUB_STEP_SUMMARY}"
        echo "::endgroup::"
