---
name: Code checks
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      precommit_check_all_files:
        description: Run pre-commit for all files (true) or only the updated ones (false)
        required: false
        type: boolean
        default: true
      precommit_config_file:
        required: false
        type: string
        default: .pre-commit-config.yaml
        description: Path to the pre-commit config file.
      push_docker_image:
        description: Whether or not to push the built Docker image to the registry
        required: false
        type: boolean
        default: false
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-checks
  cancel-in-progress: true

jobs:
  lint:
    name: Prek
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: false
    env:
      MISE_ENV: ci
      PRE_CHECK_ALL_FILES: |-
        ${{ case(github.event_name == 'workflow_dispatch', github.event.inputs.precommit_check_all_files, true) }}
      PRE_CONFIG_FILE: ${{ inputs.precommit_config_file || '.pre-commit-config.yaml' }}
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v6

      - name: Install mise
        uses: jdx/mise-action@v3

      - name: Run Prek
        uses: j178/prek-action@v2
        with:
          extra-args: |-
            ${{ case(env.PRE_CHECK_ALL_FILES == 'true', '--all-files', '') }} --config=${{ env.PRE_CONFIG_FILE }}

  node-checks:
    name: NodeJS checks
    runs-on: ubuntu-latest
    needs: lint
    if: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install mise
        uses: jdx/mise-action@v3

      - name: Install dependencies
        run: |
          cd src/server
          npm install

      - name: Run Jest tests
        run: |
          cd src/server
          npm run test

  docker-build:
    permissions:
      contents: read
      packages: write
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        id: checkout
        uses: actions/checkout@v6

      - name: Install mise
        id: mise-install
        uses: jdx/mise-action@v3

      - name: Read Node version from .mise.toml
        id: get-mise-node-version
        shell: bash
        run: |
          set -euo pipefail

          node_version="$(mise ls --local --json node | jq -r '.[0].requested_version // empty')"

          if [[ -z "${node_version}" ]]; then
            echo "Unable to read [tools].node from .mise.toml" >&2
            exit 1
          fi

          echo "node_version=${node_version}" >> "$GITHUB_OUTPUT"
          echo "Node version from .mise.toml: ${node_version}"

      - name: Docker build
        id: docker-build
        uses: ./.github/actions/docker
        with:
          docker_image_name: website
          docker_image_tag: ${{ github.sha }}
          docker_base_image_version: ${{ steps.get-mise-node-version.outputs.node_version }}-alpine
          docker_provider: github
          must_push: ${{ github.event.inputs.push_docker_image || false }}
          token: ${{ secrets.GITHUB_TOKEN }}
