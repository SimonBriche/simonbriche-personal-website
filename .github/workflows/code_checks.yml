---
name: Code checks
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      precommit_check_all_files:
        description: 'Whether to check all files with pre-commit or only the changed ones'
        required: false
        default: 'false'
      precommit_config_file:
        required: false
        type: string
        default: .pre-commit-config.yaml
        description: Path to the alternate pre-commit config file.
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-checks
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  lint:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v6

      - uses: jdx/mise-action@v3

      - name: Run pre-commit checks
        uses: ./.github/actions/pre-commit
        with:
          precommit_config_file: ${{ inputs.precommit_config_file }}
          precommit_check_all_files: ${{ inputs.precommit_check_all_files }}

  node-checks:
    name: NodeJS checks
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'

      - name: Install dependencies
        run: |
          npm install

      - name: Run Jest tests
        run: |
          npm run test
