---
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /src/server
      - /src/react-cmp
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
